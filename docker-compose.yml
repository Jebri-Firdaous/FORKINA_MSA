services:
  eureka:
    image: doussa1998/mini-project-eureka-server:latest
    container_name: eureka
    ports:
      - "8761:8761"
    environment:
      - eureka.client.register-with-eureka=false
      - eureka.client.fetch-registry=false
    networks:
      - my-network

  gateway:
    image: doussa1998/mini-project-api-gateway:latest
    container_name: apigateway
    ports:
      - "8082:8082"
    depends_on:
      - eureka
      - keycloak
    environment:
      - eureka.client.service-url.defaultZone=http://eureka:8761/eureka
      - spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/JobBoardKeycloak
    networks:
      - my-network

  milestone-management:
    image: doussa1998/mini-project-microservice-milestone:latest
    container_name: milestonecontainer
    ports:
      - "8085:8085"
    depends_on:
      - eureka
      - mysql
    command: ["sh", "-c", "dockerize -wait tcp://mysql:3306 -timeout 30s && java -jar /app.jar"]
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/milestoneDB?createDatabaseIfNotExist=true
      - spring.datasource.username=root
      - spring.datasource.password=
      - spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
      - eureka.client.service-url.defaultZone=http://eureka:8761/eureka
    networks:
      - my-network

  project-management:
    image: doussa1998/mini-project-microservice-project:latest
    container_name: projectcontainer
    ports:
      - "8084:8084"
    depends_on:
      - eureka
    environment:
      - spring.datasource.url=jdbc:h2:mem:projectDB;DB_CLOSE_ON_EXIT=FALSE
      - spring.datasource.username=sa
      - spring.datasource.password=
      - eureka.client.service-url.defaultZone=http://eureka:8761/eureka
    networks:
      - my-network

  task-management:
    image: doussa1998/mini-project-microservice-task:latest
    container_name: taskcontainer
    ports:
      - "8081:8081"
    depends_on:
      - eureka
    environment:
      - spring.datasource.url=jdbc:h2:mem:taskDB;DB_CLOSE_ON_EXIT=FALSE
      - spring.datasource.username=sa
      - spring.datasource.password=
      - eureka.client.service-url.defaultZone=http://eureka:8761/eureka
    networks:
      - my-network

  user-management:
    image: doussa1998/mini-project-microservice-user:latest
    container_name: usercontainer
    ports:
      - "8086:8086"
    depends_on:
      - eureka
      - mysql
    command: ["sh", "-c", "dockerize -wait tcp://mysql:3306 -timeout 30s && java -jar /app.jar"]
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/UserDB?createDatabaseIfNotExist=true&useSSL=false&max_allowed_packet=15728640
      - spring.datasource.username=root
      - spring.datasource.password=
      - eureka.client.service-url.defaultZone=http://eureka:8761/eureka
    networks:
      - my-network

  file-management:
    image: doussa1998/mini-project-microservice-file:latest
    container_name: file-container
    ports:
      - "8087:8087"
    depends_on:
      - eureka
      - mysql
    command: ["sh", "-c", "dockerize -wait tcp://mysql:3306 -timeout 30s && java -jar /app.jar"]
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/fileDB?createDatabaseIfNotExist=true
      - spring.datasource.username=root
      - spring.datasource.password=
      - spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
      - eureka.client.service-url.defaultZone=http://eureka:8761/eureka
      - spring.content.fs.root=./uploads
      - spring.servlet.multipart.max-file-size=25MB
      - spring.servlet.multipart.max-request-size=25MB
    networks:
      - my-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
    ports:
      - "3306:3306"
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: keycloak/keycloak:23.0.0
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY: true
    networks:
      - my-network
    command: ["start-dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  my-network:
    driver: bridge